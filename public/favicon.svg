<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#701a2b" />
      <stop offset="100%" stop-color="#460b18" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5edd3" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#b8860b" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="16" />

  <!-- Outer Decorative Gold Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 8" opacity="0.6" />

  <!-- Intertwined Hearts / Ring Symbol -->
  <g transform="translate(0, 10)">
    <!-- Left Heart -->
    <path d="M 210,170 C 170,130 110,150 110,210 C 110,270 210,340 210,340 C 210,340 230,326 248,308 C 220,275 210,230 210,170 Z" fill="url(#goldGrad)" opacity="0.9" />

    <!-- Right Heart -->
    <path d="M 302,170 C 342,130 402,150 402,210 C 402,270 302,340 302,340 C 302,340 202,270 202,210 C 202,150 262,130 302,170 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Center Gold Sparkle -->
  <path d="M 256,120 L 264,152 L 296,160 L 264,168 L 256,200 L 248,168 L 216,160 L 248,152 Z" fill="url(#goldGrad)" />
</svg>
